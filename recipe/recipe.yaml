context:
  version: "2.1.0"

package:
  name: anycrc
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/a/anycrc/anycrc-${{ version }}.tar.gz
    sha256: a907e9cf6767f6116621a85822e9c6b598cd24b01ca99302698d1d55b566427f

build:
  number: 0
  script: ${{ PYTHON }} -m pip install .

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - setuptools
    - cython
    - pip
  run:
    - python
    - bitarray

tests:
  - python:
      imports:
        - anycrc
      # sdist metadata pins bitarray==3.8.0, which upstream has since dropped
      pip_check: false

about:
  summary: The fastest general Python CRC Library
  homepage: https://github.com/marzooqy/anycrc
  repository: https://github.com/marzooqy/anycrc
  license: Zlib
  license_file:
    - LICENSE

extra:
  recipe-maintainers:
    - carlodri
